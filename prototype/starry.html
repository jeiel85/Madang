<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madang · 星座</title>
<!--
  Madang · 별자리 테마 (2D 캔버스)
  - 아이콘이 별이 된다: 아이콘 뒤에 은은한 별빛, 별자리로 뽑힌 아이콘에는 빛줄기
  - 가까운 별자리 별끼리 선으로 이어진다(최소 신장 트리 + 고리 하나). 선은 아이콘 아래로 지나가지 않는다
  - 은하수, 배경 별, 산 능선·소나무·한옥 실루엣, 달(아이콘이 적은 쪽 하늘)
  성능: 아이콘과 무관한 하늘(bg) → 아이콘 층을 더한 정적 그림(stat)을 캐시하고,
        매 프레임은 반짝이는 별·빛줄기·별똥별이 있는 작은 사각형만 stat에서 복원한 뒤 다시 그린다.
        아이콘이 바뀌면 새 정적 그림(next)을 만들어 1~2초 동안 교차 페이드한다.
  share.js가 쓰는 전역: cv, draw(), icons, W, H, WALL, TASKBAR, commit(), paused, frameN, cacheOK
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1230; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.ghosts #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #hint { position: fixed; left: 12px; bottom: 60px; color: rgba(255,255,255,.55); font: 12px/1.5 "Segoe UI", "Malgun Gothic", sans-serif; display: none; }
  body.demo #hint { display: block; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="ghosts"></div>
<div id="hint">R 새로 그리기 · M 달 · L 별자리 선 · 아이콘 끌어서 옮기기</div>
<script>
'use strict';

/* ======================================================================
   설정
   ====================================================================== */
const TASKBAR = 48;
const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');        // 바탕화면 호스트가 불러옴
const PREVIEW = QS.has('preview');       // 설정 창의 미리보기(iframe)
const SEED_OFF = (+QS.get('monitor') || 0) * 7919;   // 모니터마다 다른 풍경: 호스트가 보조 모니터 창에 monitor=1,2…를 붙인다
// 기본값은 themes.json의 default와 같아야 한다. quality·cap30은 설정에 내보내지 않는다
const P = {
  spacing: 180, lines: 0.55, density: 1, twinkle: 0.6, milky: 0.7, meteors: 3,
  showMoon: 1, showHorizon: 1, adaptive: 1,
  quality: 2, cap30: true,
};
const DEFAULTS = Object.assign({}, P);
const SLIDER_KEYS = ['spacing', 'lines', 'density', 'twinkle', 'milky', 'meteors'];
const DISPLAY_KEYS = ['showMoon', 'showHorizon', 'adaptive'];
const BG_KEYS = ['density', 'milky', 'showHorizon', 'twinkle'];      // 하늘(bg)을 다시 그려야 하는 값
const ICON_KEYS = ['spacing', 'lines', 'showMoon', 'adaptive'];      // 아이콘 층만 다시 그리면 되는 값

/* ======================================================================
   난수·노이즈
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s / 0.9375;
}
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ======================================================================
   캔버스
   ====================================================================== */
const cv = document.getElementById('art');
const ctx = cv.getContext('2d', { alpha: false });
const mkCanvas = () => document.createElement('canvas');
let bgC = mkCanvas(), statC = mkCanvas(), nextC = mkCanvas();
function fit(c) {                                  // 화면 캔버스와 같은 픽셀 크기로 맞춤
  if (c.width !== cv.width || c.height !== cv.height) { c.width = cv.width; c.height = cv.height; }
  return c.getContext('2d');
}
let W = innerWidth, H = innerHeight;
function resize() {
  W = innerWidth; H = innerHeight;
  // 미리보기는 페이지를 바탕화면 크기로 배치한 뒤 통째로 줄여 보여 주므로 낮은 해상도면 충분하다
  const scale = PREVIEW ? 0.45 : Math.min(devicePixelRatio || 1, P.quality);
  // 캔버스가 실제로 차지하는 크기(소수 포함)로 계산해야 한 픽셀 차이로 흐려지지 않는다
  const box = cv.getBoundingClientRect();
  cv.width = Math.round((box.width || W) * scale); cv.height = Math.round((box.height || H) * scale); cv._scale = scale;
  cacheOK = false;
}

/* ======================================================================
   은하수: 1/4 해상도로 한 번 계산해 두고 늘려서 그린다(시드·화면 크기가 바뀔 때만 다시 계산)
   ====================================================================== */
const mwC = mkCanvas();
let mwKey = '', MW = null;
function buildMilky() {
  const key = seed + '|' + W + '|' + H;
  if (key === mwKey) return;
  mwKey = key;
  const rnd = mulberry32(seed ^ 0x2545f491);
  const ang = (32 + 20 * rnd()) * Math.PI / 180 * (rnd() < 0.5 ? -1 : 1);     // 왼쪽 아래 → 오른쪽 위(또는 반대)
  const dx = Math.cos(ang), dy = -Math.abs(Math.sin(ang)) * Math.sign(ang || 1);
  MW = { cx: W * (0.38 + 0.24 * rnd()), cy: H * (0.34 + 0.16 * rnd()), dx, dy, nx: -dy, ny: dx, w: Math.min(W, H) * (0.12 + 0.05 * rnd()) };
  const S = 4, mw = Math.ceil(W / S) + 1, mh = Math.ceil(H / S) + 1;
  mwC.width = mw; mwC.height = mh;
  const c = mwC.getContext('2d'), img = c.createImageData(mw, mh), d = img.data;
  for (let j = 0; j < mh; j++) for (let i = 0; i < mw; i++) {
    const x = i * S, y = j * S, ox = x - MW.cx, oy = y - MW.cy;
    const s = ox * MW.dx + oy * MW.dy;
    let across = ox * MW.nx + oy * MW.ny;
    const wv = MW.w * (0.7 + 0.7 * vnoise(s * 0.0016 + 3.1, 0.5, 11));
    across += (vnoise(s * 0.0011 + 7.7, 1.5, 12) - 0.5) * MW.w * 1.5;
    const b = Math.exp(-(across / wv) * (across / wv));
    const k = (j * mw + i) * 4;
    if (b < 0.012) { d[k + 3] = 0; continue; }
    const n1 = fbm(x * 0.0045, y * 0.0045, 21), n2 = fbm(x * 0.017, y * 0.017, 22);
    let g = b * (0.3 + 1.0 * n1) + b * b * 0.55 * n2;
    // 가운데를 따라 흐르는 어두운 먼지띠
    const lane = Math.exp(-Math.pow((across + (n1 - 0.5) * wv * 0.6) / (wv * 0.2), 2)) * Math.max(0, fbm(x * 0.009, y * 0.009, 23) * 1.7 - 0.5);
    g *= 1 - Math.min(0.85, lane);
    const t = Math.min(1, b * 1.2);
    d[k] = 112 + 143 * t; d[k + 1] = 122 + 104 * t; d[k + 2] = 255 - 62 * t;      // 가장자리는 푸르게, 가운데는 따뜻하게
    d[k + 3] = Math.min(1, g) * 150;
  }
  c.putImageData(img, 0, 0);
}
function bandAt(x, y) {
  const ox = x - MW.cx, oy = y - MW.cy, a = (ox * MW.nx + oy * MW.ny) / MW.w;
  return Math.exp(-a * a);
}

/* ======================================================================
   배경 별
   ====================================================================== */
const STAR_COLORS = [[255, 255, 255], [214, 226, 255], [255, 238, 210], [255, 216, 176], [188, 208, 255]];
let stars = [], starsKey = '';
function buildStars() {
  const key = seed + '|' + W + '|' + H + '|' + P.density;
  if (key === starsKey) return;
  starsKey = key;
  const rnd = mulberry32(seed ^ 0x5bd1e995);
  const want = Math.round(W * H / 1700 * P.density);
  stars = [];
  for (let guard = 0; stars.length < want && guard < want * 8; guard++) {
    const x = rnd() * W, y = rnd() * H;
    if (rnd() > 0.36 + 0.64 * bandAt(x, y)) continue;                       // 은하수 쪽에 더 많이
    const u = rnd();
    stars.push({
      x, y, r: 0.35 + 1.3 * Math.pow(u, 7), a: 0.3 + 0.7 * rnd(),
      ci: rnd() < 0.55 ? 0 : 1 + Math.floor(rnd() * 4),
      w: 0.6 + 2.0 * rnd(), ph: rnd() * 6.283, tw: false,
    });
  }
  // 밝은 별 일부가 반짝인다(많아야 90개)
  const order = stars.map((_, i) => i).sort((i, j) => stars[j].r * stars[j].a - stars[i].r * stars[i].a);
  const n = Math.min(90, Math.round(stars.length * 0.09));
  for (let i = 0; i < n; i++) stars[order[i]].tw = true;
}

/* ======================================================================
   스프라이트(캔버스 배율마다 한 번 만든다)
   ====================================================================== */
const TINTS = [[255, 224, 178], [226, 234, 255], [172, 202, 255]];
const SPR_R = 8;                                    // 별 스프라이트 반지름(CSS px)
const SPIKE_H = 64, SPIKE_V = 26;                   // 빛줄기 반 길이(가로/세로, CSS px)
let sprK = 0, starSpr = [], spikeSpr = [];
function ensureSprites(k) {
  if (k === sprK) return;
  sprK = k;
  starSpr = STAR_COLORS.map(col => {
    const c = mkCanvas(), s = Math.max(4, Math.ceil(SPR_R * 2 * k));
    c.width = c.height = s;
    const g = c.getContext('2d'), m = s / 2, gr = g.createRadialGradient(m, m, 0, m, m, m);
    gr.addColorStop(0, rgba(col, 1)); gr.addColorStop(0.12, rgba(col, 0.95)); gr.addColorStop(0.3, rgba(col, 0.28));
    gr.addColorStop(0.6, rgba(col, 0.07)); gr.addColorStop(1, rgba(col, 0));
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    return c;
  });
  spikeSpr = TINTS.map(col => {
    const c = mkCanvas(), w = Math.ceil(SPIKE_H * 2 * k), h = Math.ceil(SPIKE_V * 2 * k);
    c.width = w; c.height = h;
    const g = c.getContext('2d'), mx = w / 2, my = h / 2;
    const glow = g.createRadialGradient(mx, my, 0, mx, my, 16 * k);
    glow.addColorStop(0, rgba(col, 0.9)); glow.addColorStop(0.4, rgba(col, 0.25)); glow.addColorStop(1, rgba(col, 0));
    g.fillStyle = glow; g.fillRect(mx - 16 * k, my - 16 * k, 32 * k, 32 * k);
    for (const [len, thick, a] of [[SPIKE_H, 3.2, 0.16], [SPIKE_H, 1.1, 0.8]]) {        // 가로 빛줄기: 넓고 흐린 것 + 가늘고 밝은 것
      const lg = g.createLinearGradient(mx - len * k, 0, mx + len * k, 0);
      lg.addColorStop(0, rgba(col, 0)); lg.addColorStop(0.5, rgba(col, a)); lg.addColorStop(1, rgba(col, 0));
      g.fillStyle = lg; g.fillRect(mx - len * k, my - thick * k / 2, len * 2 * k, thick * k);
    }
    for (const [thick, a] of [[3.2, 0.14], [1.1, 0.7]]) {                                // 세로 빛줄기(짧게)
      const lg = g.createLinearGradient(0, my - SPIKE_V * k, 0, my + SPIKE_V * k);
      lg.addColorStop(0, rgba(col, 0)); lg.addColorStop(0.5, rgba(col, a)); lg.addColorStop(1, rgba(col, 0));
      g.fillStyle = lg; g.fillRect(mx - thick * k / 2, my - SPIKE_V * k, thick * k, SPIKE_V * 2 * k);
    }
    return c;
  });
}
const starHalf = s => 2.2 + s.r * 4.4;              // 스프라이트로 그릴 때 반 크기(CSS px)

/* ======================================================================
   하늘(bg): 아이콘과 무관한 부분
   ====================================================================== */
function horizonBase() { return H - TASKBAR; }
function backRidge(x) { return horizonBase() - 62 - 58 * fbm(x * 0.0021 + 3.7, 0.3, 31); }
function frontRidge(x) { return horizonBase() - 16 - 30 * fbm(x * 0.0042 + 9.1, 0.7, 41); }
function drawPine(c, x, y, h) {
  c.beginPath();
  for (let i = 0; i < 3; i++) {
    const top = y - h * (0.42 + i * 0.29), half = h * (0.34 - i * 0.08), bot = y - h * (i * 0.27);
    c.moveTo(x - half, bot); c.lineTo(x, top); c.lineTo(x + half, bot);
  }
  c.rect(x - h * 0.03, y - h * 0.12, h * 0.06, h * 0.14);
  c.fill();
}
function drawHanok(c, hx, gy, s) {
  const w = 150 * s;
  // 벽
  c.fillRect(hx - w * 0.36, gy - 18 * s, w * 0.72, 20 * s);
  // 팔작지붕: 처마 끝이 위로 들린 곡선, 용마루 양끝도 살짝 들린다
  c.beginPath();
  c.moveTo(hx - w * 0.56, gy - 27 * s);
  c.quadraticCurveTo(hx, gy - 12 * s, hx + w * 0.56, gy - 27 * s);            // 아래 처마선
  c.quadraticCurveTo(hx + w * 0.42, gy - 31 * s, hx + w * 0.33, gy - 47 * s); // 오른쪽 지붕면
  c.lineTo(hx + w * 0.36, gy - 52 * s);
  c.quadraticCurveTo(hx, gy - 46 * s, hx - w * 0.36, gy - 52 * s);            // 용마루
  c.lineTo(hx - w * 0.33, gy - 47 * s);
  c.quadraticCurveTo(hx - w * 0.42, gy - 31 * s, hx - w * 0.56, gy - 27 * s); // 왼쪽 지붕면
  c.fill();
}
function paintHorizon(c, rnd) {
  const base = horizonBase();
  // 뒤 능선 + 그 아래 옅은 안개
  c.fillStyle = '#0c1433';
  c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x <= W + 8; x += 8) c.lineTo(x, backRidge(x));
  c.lineTo(W + 8, H); c.closePath(); c.fill();
  const mist = c.createLinearGradient(0, base - 110, 0, base);
  mist.addColorStop(0, 'rgba(70,92,160,0)'); mist.addColorStop(1, 'rgba(70,92,160,0.22)');
  c.fillStyle = mist; c.fillRect(0, base - 110, W, 110 + TASKBAR);
  // 앞 능선, 소나무, 한옥
  const ink = '#04060f';
  c.fillStyle = ink;
  c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x <= W + 6; x += 6) c.lineTo(x, frontRidge(x));
  c.lineTo(W + 6, H); c.closePath(); c.fill();
  const s = Math.max(0.75, Math.min(1.3, H / 1080));
  const hx = W * (0.18 + 0.64 * rnd()), hw = 150 * s;
  for (let x = rnd() * 40; x < W; x += (26 + rnd() * 70) * s) {
    if (Math.abs(x - hx) < hw * 0.75) continue;                          // 한옥 자리는 비운다
    if (rnd() < 0.3) continue;
    drawPine(c, x, frontRidge(x) + 3, (16 + rnd() * 30) * s);
  }
  const gy = Math.max(frontRidge(hx - hw * 0.4), frontRidge(hx), frontRidge(hx + hw * 0.4)) + 2;
  drawHanok(c, hx, gy, s);
  // 창호에 켜진 불빛
  const lit = [[-0.22, 13], [0.06, 13]];
  for (const [fx, wdt] of lit) {
    const lx = hx + hw * fx, ly = gy - 13 * s;
    const glow = c.createRadialGradient(lx + wdt * s / 2, ly + 4 * s, 0, lx + wdt * s / 2, ly + 4 * s, 30 * s);
    glow.addColorStop(0, 'rgba(255,196,110,0.32)'); glow.addColorStop(1, 'rgba(255,196,110,0)');
    c.fillStyle = glow; c.fillRect(lx - 30 * s, ly - 30 * s, 60 * s + wdt * s, 60 * s);
    c.fillStyle = '#ffc977'; c.fillRect(lx, ly, wdt * s, 9 * s);
    c.fillStyle = ink; c.fillRect(lx + wdt * s / 2 - 0.6 * s, ly, 1.2 * s, 9 * s);   // 창살
  }
}
function paintBg() {
  const k = cv._scale, c = fit(bgC);
  c.setTransform(k, 0, 0, k, 0, 0);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  const sky = c.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#050817'); sky.addColorStop(0.5, '#0b1330'); sky.addColorStop(1, '#1a2453');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  if (P.milky > 0) {
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = P.milky;
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
    c.drawImage(mwC, 0, 0, mwC.width * 4, mwC.height * 4);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  }
  // 별: 작은 별은 점으로, 밝은 별은 스프라이트로. 반짝이는 별은 매 프레임 따로 그린다(반짝임 0이면 여기서 굽는다)
  const bakeTw = P.twinkle <= 0;
  for (const s of stars) {
    if (s.tw && !bakeTw) continue;
    if (s.r < 0.8) {
      c.fillStyle = rgba(STAR_COLORS[s.ci], Math.min(1, s.a * 1.1));
      c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.283); c.fill();
    } else {
      const h = starHalf(s);
      c.globalAlpha = s.a; c.drawImage(starSpr[s.ci], s.x - h, s.y - h, h * 2, h * 2); c.globalAlpha = 1;
    }
  }
  if (P.showHorizon) paintHorizon(c, mulberry32(seed ^ 0x68e31da4));
  bgOK = true;
}

/* ======================================================================
   아이콘 층: 아이콘 뒤 별빛, 별자리 선, 달
   ====================================================================== */
let icons = [];
let cstars = [], cstarsOld = [];                   // 빛줄기가 붙는 별자리 별 {x, y, ti, w, ph}
const glyphPos = ic => ({ x: ic.x + ic.w / 2, y: ic.y + Math.min(ic.h * 0.36, 30) });
function pickStars(pts) {                          // 간격 이상 떨어진 아이콘만 별자리 별로(시드마다 순서가 다르다)
  const order = pts.map((p, i) => [hash2(Math.round(p.x), Math.round(p.y), 77), i]).sort((a, b) => a[0] - b[0]);
  const out = [], d2 = P.spacing * P.spacing;
  for (const [, i] of order) {
    const p = pts[i];
    if (out.every(q => (q.x - p.x) ** 2 + (q.y - p.y) ** 2 >= d2)) out.push(p);
  }
  return out;
}
// 선분이 사각형을 지나는 구간(t0~t1, 0~1). 지나지 않으면 null
function segInRect(ax, ay, bx, by, r) {
  let t0 = 0, t1 = 1;
  const dx = bx - ax, dy = by - ay;
  for (const [p, q] of [[-dx, ax - r.x0], [dx, r.x1 - ax], [-dy, ay - r.y0], [dy, r.y1 - ay]]) {
    if (p === 0) { if (q < 0) return null; continue; }
    const t = q / p;
    if (p < 0) { if (t > t1) return null; if (t > t0) t0 = t; }

  let drag = null;
  addEventListener('pointerdown', e => {
    const ic = icons.find(i => e.clientX >= i.x && e.clientX < i.x + i.w && e.clientY >= i.y && e.clientY < i.y + i.h);
    if (ic) drag = { ic, dx: e.clientX - ic.x, dy: e.clientY - ic.y };
  });
  addEventListener('pointermove', e => { if (drag) { drag.ic.x = e.clientX - drag.dx; drag.ic.y = e.clientY - drag.dy; drawGhosts(); } });
  addEventListener('pointerup', () => { if (drag) { drag = null; commit(); } });
  addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') reseed((Math.random() * 1e6) | 0);
    else if (e.key === 'm' || e.key === 'M') applySettings({ showMoon: 1 - P.showMoon });
    else if (e.key === 'l' || e.key === 'L') applySettings({ lines: P.lines > 0 ? 0 : DEFAULTS.lines });
  });
}

let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { resize(); }, 100); });

window.__dbg = {
  P,
  bench() {                                         // 정적 그림을 다시 만드는 시간과 한 프레임 시간
    const a = performance.now(); mwKey = ''; starsKey = ''; cacheOK = false; draw(performance.now());
    const b = performance.now(); draw(performance.now()); const c = performance.now();
    return { rebuild: +(b - a).toFixed(1), frame: +(c - b).toFixed(2), canvas: cv.width + 'x' + cv.height, stars: stars.length, sprites: lastRects.length };
  },
};
resize();
if (WALL || PREVIEW) startHostedMode(); else startDemo();
requestAnimationFrame(frame);
</script>
